# The whole tool is two containers: a Go API that parses archives on disk, and
# an nginx serving the built frontend and proxying /api to it.
#
# There used to be postgres, redis, minio and a worker here. They came from the
# phase-1 scaffold and were never used: the backend imports no database, no
# redis client and no S3 client, and cmd/worker was a sleep loop. They cost
# three image pulls and a 4 GB postgres on every `docker compose up`, and one of
# them (minio) is what broke the build on macOS. If the parser ever needs a job
# queue or object storage, add the service back at that point.
services:
  api:
    build: ./backend
    command: ["/app/api"]
    environment:
      API_PORT: "8081"
      UPLOAD_DIR: /data/uploads
      # The API answers only for Host values it recognises (localhost, a bare
      # IP, and the compose service names). That is what stops a hostile site
      # from pointing a name it controls at 127.0.0.1 and talking to this API
      # as though it were same-origin — DNS rebinding.
      #
      # Reaching the tool by any other name means listing it here, comma
      # separated. "*" turns the check off for a deployment behind a proxy
      # that rewrites Host.
      ALLOWED_HOSTS: ""
      # Empty means no CORS headers at all, which is right for both supported
      # deployments: nginx and the Vite dev proxy both make the API same-origin.
      # Set a single concrete origin only if you split the frontend off. Never
      # a wildcard — this API has no authentication, so "*" lets any page the
      # user visits read every archive they have uploaded.
      CORS_ALLOW_ORIGIN: ""
      # Let Go's GC work against the container limit instead of discovering it
      # by being killed. Keep this below mem_limit.
      GOMEMLIMIT: "3GiB"
    ports:
      - "8081:8081"
    volumes:
      - upload-data:/data/uploads
    # a parse that still runs the container out of memory should come back
    # rather than leave nginx talking to a dead upstream (502 Bad Gateway)
    restart: unless-stopped
    mem_limit: 4g

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  upload-data:
