server {
    listen 80;
    client_max_body_size 512m;

    # Version disclosure in the Server header tells a scanner exactly which
    # nginx CVEs to try. It costs nothing to withhold it.
    server_tokens off;

    # The app renders log text, config values and file paths taken straight out
    # of an uploaded archive. React escapes all of it, and the API serves file
    # contents as text/plain, so nothing here is interpreted as markup today —
    # these headers are the second line of defence if that ever stops being
    # true.
    #
    # The CSP has no 'unsafe-eval' and no remote origins because the build is
    # entirely self-contained: one bundle, one stylesheet, no CDN. 'unsafe-inline'
    # for styles is required by dygraphs, which positions its canvas layers
    # with inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Nothing here uses a camera, microphone, location or payment API.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass http://api:8081;
        proxy_request_buffering off;

        # The upstream sets its own security headers; passing the real Host
        # through keeps the API's Host check meaningful rather than making
        # every proxied request look like it came from "api".
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A search runs to a 20s deadline and an upload can take minutes;
        # the default 60s proxy_read_timeout would cut both short.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
